[project]
name = "inference-from-scratch"
version = "0.1.0"
description = "An LLM inference server built from scratch in PyTorch + FastAPI, with step by step benchmarked optimizations. KV cache, continuous batching, admission control, compared against vLLM."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.138.0",
    "matplotlib>=3.11.0",
    "tiktoken>=0.13.0",
    "torch>=2.12.1",
    "transformers>=5.12.1",
]
